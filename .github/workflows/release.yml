name: Release

# Vydání se spouští pushnutím tagu ve tvaru vRR.M.P, např.:
#   git tag v26.11.0 && git push origin v26.11.0
# Tag s příponou (v26.12.0-pre1) se vydá jako pre-release.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Verze z tagu
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' neodpovídá formátu vRR.M.P[-přípona]."
            exit 1
          fi

          # kontrola shody s verzí v pom.xml (bez -SNAPSHOT a bez přípony tagu)
          POM_VERSION=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "${POM_VERSION%-SNAPSHOT}" != "${VERSION%%-*}" ]]; then
            echo "::error::Verze tagu ($VERSION) neodpovídá verzi v pom.xml ($POM_VERSION)."
            exit 1
          fi

          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Nastavení verze vydání
        run: |
          ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Sestavení a testy
        run: ./mvnw -B clean verify

      - name: Příprava artefaktů
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p release
          cp bakakeeper-cli/target/BakaKeeper-${VERSION}.jar release/
          cp bakakeeper-gui/target/BakaKeeper-GUI-${VERSION}.jar release/
          cd release && sha256sum *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Vytvoření GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          FLAGS=()
          [[ "${{ steps.version.outputs.prerelease }}" == "true" ]] && FLAGS+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "BakaKeeper ${VERSION}" \
            --generate-notes \
            "${FLAGS[@]}"
